name: Build V2 Release

# Manually-triggered release build for the V2 maintenance line (2.x.x), always
# built from the V2-Main branch — without going through a GitHub Release on the
# default branch. The published version comes from `jarVersion` in build.gradle
# on V2-Main.
#
# If main ever moves to a new major (e.g. 4.x), copy this file to
# build-v3-release.yml and change the checkout ref to the V3 maintenance branch.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to push the release tag back to the repo using the default token.
    permissions:
      contents: write
    env:
      BUILD_EVENT: 'release'
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      GODEBUG: x509sha1=1
    steps:
      - name: Setup JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14' # Quotes required to prevent YAML converting to number
      - name: Setup GO
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Nats Server
        run: |
          pkill -9 nats-server 2>/dev/null || true
          mkdir -p ~/.local/bin
          cd $GITHUB_WORKSPACE
          git clone https://github.com/nats-io/nats-server.git
          cd nats-server
          go build -o ~/.local/bin/nats-server
          nats-server -v
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: V2-Main
      - name: Read release version
        id: version
        run: |
          # Pull `def jarVersion = "X.Y.Z"` out of build.gradle and expose it as
          # a step output for the tag step below.
          VERSION=$(grep -E '^def jarVersion' build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse jarVersion from build.gradle"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
      - name: Fail if tag already exists
        run: |
          # Refuse to publish over an existing tag (forgot to bump jarVersion,
          # or accidentally clicked Run twice).
          VERSION='${{ steps.version.outputs.value }}'
          if git ls-remote --tags --exit-code origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists on origin. Bump jarVersion in build.gradle on V2-Main before re-running."
            exit 1
          fi
      - name: Build and Test
        run: chmod +x gradlew && ./gradlew clean test
      - name: Verify, Sign and Publish Release
        run: ./gradlew -i signArchives signMavenJavaPublication publishToSonatype closeAndReleaseSonatypeStagingRepository
      - name: Tag V2-Main with the release version
        run: |
          # Publish succeeded — tag the V2-Main commit we just built and push.
          # Using an annotated tag so the release carries author/date metadata.
          VERSION='${{ steps.version.outputs.value }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
      - name: Clean up
        if: always()
        run: pkill -9 nats-server 2>/dev/null || true
